<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTimer — Главный кабинет</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        .main-menu-btn { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .main-menu-btn.active { background: linear-gradient(90deg, rgba(99,102,241,0.15) 0%, transparent 100%); border-left: 3px solid #818cf8; color: white; }
        .main-menu-btn.inactive { color: #94a3b8; }
        .main-menu-btn.inactive:hover { background: rgba(255,255,255,0.02); color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const socket = typeof io !== 'undefined' ? io() : { emit: () => {}, on: () => {}, off: () => {} };

        const supabaseUrl = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        const supabaseKey = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx'; 
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function AuthScreen({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setError('');
                if (isLogin) {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) setError(error.message); else onLogin(data.user);
                } else {
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) setError(error.message);
                    else {
                        const loginResult = await supabase.auth.signInWithPassword({ email, password });
                        if (!loginResult.error) onLogin(loginResult.data.user);
                    }
                }
            };

            return (
                <div className="h-screen w-screen flex items-center justify-center bg-slate-950 text-white">
                    <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl w-full max-w-md animate-fade-in-up">
                        <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-indigo-500/20 rounded-2xl flex items-center justify-center border border-indigo-500/30 text-indigo-400 text-3xl"><i className="fa-solid fa-bolt"></i></div></div>
                        <h1 className="text-3xl font-black text-center text-white mb-6">TikTimer Studio</h1>
                        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                            {error && <div className="bg-rose-500/20 border border-rose-500 text-rose-400 p-3 rounded-xl text-sm text-center">{error}</div>}
                            <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 outline-none focus:border-indigo-500" required />
                            <input type="password" placeholder="Пароль" value={password} onChange={e => setPassword(e.target.value)} className="bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 outline-none focus:border-indigo-500" required />
                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl mt-2 transition text-white">{isLogin ? 'Войти' : 'Зарегистрироваться'}</button>
                        </form>
                        <p className="text-center text-slate-500 mt-4 text-sm cursor-pointer hover:text-slate-300" onClick={() => setIsLogin(!isLogin)}>
                            {isLogin ? 'Создать новый аккаунт' : 'Уже есть аккаунт? Войти'}
                        </p>
                    </div>
                </div>
            );
        }

        function PaymentWidget({ user, onVerified }) {
            const [amount, setAmount] = useState(null);
            const [wallet, setWallet] = useState('');
            const [checking, setChecking] = useState(false);
            const [creating, setCreating] = useState(false);
            const [error, setError] = useState('');
            const qrRef = useRef(null);

            useEffect(() => {
                const onCreated = (data) => { 
                    setCreating(false); setAmount(data.amount); setWallet(data.wallet);
                    setTimeout(() => {
                        if (qrRef.current) {
                            qrRef.current.innerHTML = '';
                            new QRCode(qrRef.current, { text: `ton://transfer/${data.wallet}?amount=${data.amount * 1000000000}&text=TikTimer`, width: 180, height: 180, colorDark : "#0f172a", colorLight : "#ffffff" });
                        }
                    }, 100);
                };
                const onSuccess = (data) => { setChecking(false); onVerified(data.expireDate); };
                const onNotFound = () => { setChecking(false); setError('Платеж не найден. Проверьте отправленную сумму.'); };
                const onError = (data) => { setChecking(false); setCreating(false); setError(data.message); };

                socket.on('payment-created', onCreated);
                socket.on('payment-success', onSuccess);
                socket.on('payment-not-found', onNotFound);
                socket.on('payment-error', onError);
                
                return () => { 
                    socket.off('payment-created', onCreated); 
                    socket.off('payment-success', onSuccess); 
                    socket.off('payment-not-found', onNotFound); 
                    socket.off('payment-error', onError); 
                };
            }, [onVerified]);

            return (
                <div className="flex flex-col items-center text-center w-full max-w-sm mx-auto">
                    <div className="w-16 h-16 bg-indigo-500/10 flex items-center justify-center rounded-2xl mb-4 border border-indigo-500/20"><i className="fa-brands fa-telegram text-3xl text-indigo-400"></i></div>
                    <h3 className="text-2xl font-black mb-2 text-white">Продление Подписки</h3>
                    <p className="text-slate-400 mb-6 text-sm">Доступ предоставляется на 30 дней. Время плюсуется.</p>
                    
                    {!amount ? (
                        <button onClick={() => { setCreating(true); setError(''); socket.emit('create-payment', user.id); }} disabled={creating} className="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl font-bold text-white transition flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(99,102,241,0.3)]">
                            {creating ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Подготовка...</> : <><i className="fa-brands fa-telegram"></i> Оплатить 50 USDT (TON)</>}
                        </button>
                    ) : (
                        <div className="w-full flex flex-col items-center animate-fade-in-up">
                            <div className="bg-white p-3 rounded-2xl mb-4 shadow-lg" ref={qrRef}></div>
                            <div className="bg-slate-950 border border-slate-800 w-full p-4 rounded-xl mb-4 flex flex-col gap-1 shadow-inner">
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">Точная сумма:</span>
                                <span className="text-emerald-400 font-mono text-3xl font-black">{amount} USDT</span>
                                <span className="text-rose-400 text-[10px] mt-1 font-semibold">*Переведите ровно указанное количество (включая копейки)!</span>
                            </div>
                            <a href={`ton://transfer/${wallet}?amount=${amount * 1000000000}&text=TikTimer`} className="w-full bg-[#3390ec] hover:bg-[#2a7bcf] text-white py-3 rounded-xl font-bold transition flex items-center justify-center gap-2 mb-3 shadow-lg">
                                <i className="fa-solid fa-wallet"></i> Открыть Tonkeeper
                            </a>
                            <button onClick={() => { setChecking(true); setError(''); socket.emit('verify-payment', { uid: user.id, amount }); }} disabled={checking} className="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 py-3 rounded-xl font-bold transition border border-slate-700">
                                {checking ? 'Проверка...' : 'Проверить оплату'}
                            </button>
                        </div>
                    )}
                    {error && <div className="mt-4 p-3 bg-rose-500/10 border border-rose-500/50 rounded-xl text-rose-400 text-sm font-bold w-full">{error}</div>}
                </div>
            );
        }

        function Dashboard({ user, subUntil, setSubUntil, onLogout }) {
            const [activeMainTab, setActiveMainTab] = useState('connect');
            const [status, setStatus] = useState({ tt: { text: 'Ожидание', isActive: false, isStreamLive: false }, da: 'Ожидание', dp: 'Ожидание', dx: 'Ожидание' });
            const [config, setConfig] = useState({ username: '', ttApiKey: '', daToken: '', dpApiKey: '', dxToken: '' });

            const daysLeft = subUntil ? Math.max(0, Math.ceil((new Date(subUntil) - new Date()) / (1000 * 60 * 60 * 24))) : 0;

            useEffect(() => {
                socket.emit('join-room', user.id);
                supabase.from('ttimer_settings').select('config').eq('user_id', user.id).single().then(({ data }) => {
                    if (data && data.config) setConfig(p => ({ ...p, ...data.config }));
                });
                socket.on('status-update', s => setStatus(s));
                return () => socket.off('status-update');
            }, [user.id]);

            const saveConnectionConfig = (updated) => {
                setConfig(updated);
                supabase.from('ttimer_settings').upsert({ user_id: user.id, config: updated });
            };

            return (
                <div className="flex h-screen bg-slate-950 text-slate-200 overflow-hidden relative">
                    {/* Sidebar */}
                    <aside className="w-[280px] bg-slate-900 border-r border-slate-800 flex flex-col z-20 shrink-0 shadow-2xl relative">
                        <div className="p-8 border-b border-slate-800">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 bg-indigo-500/20 rounded-xl flex items-center justify-center border border-indigo-500/30"><i className="fa-solid fa-bolt text-indigo-400 text-xl"></i></div>
                                <h1 className="text-2xl font-black text-white tracking-wide">TikTimer</h1>
                            </div>
                            <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest bg-indigo-500/10 px-2 py-1 rounded-md">Streamer Portal</span>
                        </div>
                        
                        <nav className="flex-1 py-6 flex flex-col gap-1 overflow-y-auto">
                            <h3 className="px-6 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Навигация</h3>
                            
                            <button onClick={() => setActiveMainTab('connect')} className={`main-menu-btn w-full flex items-center gap-4 px-6 py-4 font-bold text-sm ${activeMainTab === 'connect' ? 'active' : 'inactive'}`}>
                                <i className="fa-solid fa-wifi w-5 text-center text-lg"></i> Подключения
                            </button>

                            <a href="/settingtimer.html" className="main-menu-btn w-full flex items-center justify-between px-6 py-4 font-bold text-sm inactive">
                                <div className="flex items-center gap-4">
                                    <i className="fa-solid fa-stopwatch w-5 text-center text-lg text-indigo-400"></i> Настройки Таймера
                                </div>
                                <i className="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500"></i>
                            </a>

                            <button onClick={() => setActiveMainTab('payment')} className={`main-menu-btn w-full flex items-center gap-4 px-6 py-4 font-bold text-sm ${activeMainTab === 'payment' ? 'active' : 'inactive'}`}>
                                <i className="fa-solid fa-credit-card w-5 text-center text-lg"></i> Оплата Подписки
                            </button>
                        </nav>
                        
                        <div className="p-6 border-t border-slate-800 flex flex-col gap-4">
                            <div className="bg-gradient-to-br from-indigo-900/40 to-slate-800/40 border border-indigo-500/30 p-4 rounded-2xl relative overflow-hidden">
                                <h4 className="text-[10px] font-bold text-indigo-300 uppercase tracking-wider mb-1 flex items-center gap-2"><i className="fa-solid fa-crown"></i> Статус Подписки</h4>
                                <div className="text-xl font-black text-white">{daysLeft} <span className="text-xs text-slate-400 font-medium">дней доступно</span></div>
                            </div>
                            <button onClick={onLogout} className="w-full text-slate-500 hover:text-rose-400 text-xs font-bold transition flex items-center justify-center gap-2"><i className="fa-solid fa-arrow-right-from-bracket"></i> Выйти из аккаунта</button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
                        {activeMainTab === 'connect' && (
                            <div className="max-w-4xl mx-auto space-y-8 animate-fade-in-up">
                                <div>
                                    <h2 className="text-4xl font-black text-white mb-2">Подключения Платформ</h2>
                                    <p className="text-slate-400 text-sm">Свяжите аккаунты стриминга и донатов для автоматического управления таймером.</p>
                                </div>
                                
                                <div className="grid grid-cols-1 gap-4">
                                    {/* TikTok Connection */}
                                    <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-3xl shadow-xl flex items-center gap-6 hover:border-cyan-500/30 transition">
                                        <div className="w-16 h-16 bg-cyan-500/10 flex items-center justify-center rounded-2xl border border-cyan-500/20 shrink-0"><i className="fa-brands fa-tiktok text-cyan-400 text-3xl"></i></div>
                                        <div className="flex flex-col w-1/4 shrink-0"><h3 className="font-bold text-lg text-white">TikTok Live</h3><span className={`text-xs font-bold ${status.tt.isActive ? 'text-emerald-400' : 'text-slate-500'}`}>{status.tt.text}</span></div>
                                        <div className="flex-1 flex gap-3">
                                            {!status.tt.isActive && <><input type="text" value={config.username} onChange={e=>{ const u = {...config, username: e.target.value}; setConfig(u); saveConnectionConfig(u); }} placeholder="@username" className="w-1/2 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none text-sm text-white" /><input type="text" value={config.ttApiKey} onChange={e=>{ const u = {...config, ttApiKey: e.target.value}; setConfig(u); saveConnectionConfig(u); }} placeholder="API Key" className="w-1/2 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none text-sm text-white" /></>}
                                        </div>
                                        <button onClick={() => status.tt.isActive ? socket.emit('disconnect-tiktok') : socket.emit('connect-tiktok', { username: config.username, apiKey: config.ttApiKey })} className={`px-8 py-3 rounded-xl font-bold text-sm text-white transition ${status.tt.isActive ? 'bg-rose-600 hover:bg-rose-500' : 'bg-cyan-600 hover:bg-cyan-500'}`}>{status.tt.isActive ? 'Отключить' : 'Подключить'}</button>
                                    </div>

                                    {/* DA Connection */}
                                    <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-3xl shadow-xl flex items-center gap-6 hover:border-orange-500/30 transition">
                                        <div className="w-16 h-16 bg-orange-500/10 flex items-center justify-center rounded-2xl border border-orange-500/20 shrink-0"><i className="fa-solid fa-shield-halved text-orange-400 text-3xl"></i></div>
                                        <div className="flex flex-col w-1/4 shrink-0"><h3 className="font-bold text-lg text-white">DonationAlerts</h3><span className={`text-xs font-bold ${status.da.includes('Успешно') ? 'text-emerald-400' : 'text-slate-500'}`}>{status.da}</span></div>
                                        <div className="flex-1 text-sm text-slate-500">Авторизация по OAuth</div>
                                        <button onClick={() => status.da.includes('Успешно') ? socket.emit('disconnect-da') : window.open(`https://www.donationalerts.com/oauth/authorize?client_id=12952&response_type=token&scope=oauth-user-show%20oauth-donation-subscribe&redirect_uri=${window.location.origin}/da-callback`, '_blank', 'width=500,height=700')} className={`px-8 py-3 rounded-xl font-bold text-sm text-white transition ${status.da.includes('Успешно') ? 'bg-rose-600 hover:bg-rose-500' : 'bg-orange-600 hover:bg-orange-500'}`}>{status.da.includes('Успешно') ? 'Отключить' : 'Авторизоваться'}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeMainTab === 'payment' && (
                            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl animate-fade-in-up">
                                <PaymentWidget user={user} onVerified={(date) => setSubUntil(date)} />
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null); 
            const [loading, setLoading] = useState(true);
            const [subUntil, setSubUntil] = useState(null);

            const checkSub = async (uid) => {
                const { data } = await supabase.from('ttimer_settings').select('subscription_until').eq('user_id', uid).single();
                if (data) setSubUntil(data.subscription_until);
                setLoading(false);
            };

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => { 
                    const u = session?.user ?? null;
                    setUser(u);
                    if (u) checkSub(u.id); else setLoading(false);
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, session) => { 
                    const u = session?.user ?? null;
                    setUser(u);
                    if (u) checkSub(u.id); else { setSubUntil(null); setLoading(false); }
                });
                return () => subscription.unsubscribe();
            }, []);

            if (loading) return <div className="h-screen w-screen flex flex-col items-center justify-center bg-slate-950 text-indigo-500"><i className="fa-solid fa-circle-notch fa-spin text-4xl mb-4"></i></div>;
            if (!user) return <AuthScreen onLogin={(u) => { setLoading(true); checkSub(u.id); }} />;
            
            return <Dashboard user={user} subUntil={subUntil} setSubUntil={setSubUntil} onLogout={() => supabase.auth.signOut()} />;
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />);
    </script>
</body>
</html>
