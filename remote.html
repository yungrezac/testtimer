<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульт Управления TikTimer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0;}
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes progress-shimmer { 0% { background-position: 0 0; } 100% { background-position: 40px 0; } }
        .animate-progress-shimmer { background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent); background-size: 40px 40px; animation: progress-shimmer 1s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const socket = io();

        const formatTime = (totalSeconds) => {
            const h = Math.floor(Math.abs(totalSeconds) / 3600); const m = Math.floor((Math.abs(totalSeconds) % 3600) / 60); const s = Math.abs(totalSeconds) % 60;
            return `${totalSeconds < 0 ? '-' : ''}${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        function RemoteApp() {
            const [state, setState] = useState({ timeLeft: 0, currentTotalLikes: 0, likesRouletteThreshold: 100000, likesRouletteEnabled: false }); 
            const [history, setHistory] = useState([]);
            const [customSeconds, setCustomSeconds] = useState(60);
            const [status, setStatus] = useState({ tt: { text: 'Ожидание', isActive: false }, da: 'Ожидание', dp: 'Ожидание', dx: 'Ожидание' });
            const [error, setError] = useState(null);

            useEffect(() => { 
                const urlParams = new URLSearchParams(window.location.search);
                const uid = urlParams.get('uid');
                
                if (!uid) {
                    setError('Не указан UID пользователя. Запустите пульт из главной панели TikTimer.');
                    return;
                }

                socket.emit('join-room', uid);

                // Получение актуальных данных и истории
                socket.on('init-remote-data', (data) => {
                    if (data.history) setHistory(data.history);
                });

                socket.on('timer-tick', s => setState(s)); 
                socket.on('status-update', s => setStatus(s));
                
                socket.on('new-alert', data => {
                    setHistory(prev => {
                        const newHistory = [data, ...prev];
                        return newHistory.slice(0, 50); // Храним только 50 для производительности
                    });
                });
                
                return () => { 
                    socket.off('timer-tick'); 
                    socket.off('new-alert'); 
                    socket.off('init-remote-data');
                    socket.off('status-update');
                }; 
            }, []);

            if (error) {
                return <div className="h-screen flex items-center justify-center text-rose-500 font-bold p-8 text-center">{error}</div>;
            }

            return (
                <div className="h-screen w-screen flex">
                    
                    {/* ЛЕВАЯ ЧАСТЬ: УПРАВЛЕНИЕ И СТАТУСЫ */}
                    <div className="w-1/2 p-6 border-r border-slate-800 flex flex-col gap-6 bg-slate-900 overflow-y-auto">
                        
                        <div className="flex justify-between items-center bg-slate-950 p-4 rounded-2xl border border-slate-800">
                            <div>
                                <h1 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Пульт TikTimer</h1>
                                <p className="text-xs text-slate-500 mt-1">Отдельное окно управления</p>
                            </div>
                            <div className="text-4xl font-black drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] text-white">{formatTime(state.timeLeft)}</div>
                        </div>

                        {/* Статусы подключений */}
                        <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 grid grid-cols-2 gap-3">
                            <div className="flex items-center gap-2">
                                <div className={`w-2.5 h-2.5 rounded-full ${status.tt.isActive ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-rose-500'}`}></div>
                                <span className="text-sm font-bold text-slate-300">TikTok: <span className="text-xs text-slate-500 font-normal">{status.tt.text}</span></span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className={`w-2.5 h-2.5 rounded-full ${status.da.includes('Успешно') ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-slate-600'}`}></div>
                                <span className="text-sm font-bold text-slate-300">DA: <span className="text-xs text-slate-500 font-normal">{status.da}</span></span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className={`w-2.5 h-2.5 rounded-full ${status.dp.includes('Успешно') ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-slate-600'}`}></div>
                                <span className="text-sm font-bold text-slate-300">DP: <span className="text-xs text-slate-500 font-normal">{status.dp}</span></span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className={`w-2.5 h-2.5 rounded-full ${status.dx.includes('Успешно') ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-slate-600'}`}></div>
                                <span className="text-sm font-bold text-slate-300">DX: <span className="text-xs text-slate-500 font-normal">{status.dx}</span></span>
                            </div>
                        </div>

                        {/* Лайки */}
                        {state.likesRouletteEnabled && (
                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                <div className="flex justify-between items-end mb-2">
                                    <span className="text-xs text-slate-400 font-bold uppercase tracking-wider flex items-center gap-1">
                                        <i className="fa-solid fa-heart text-rose-500 animate-pulse text-sm"></i> 
                                        <span className="text-rose-400">{(state.currentTotalLikes || 0).toLocaleString()} Лайков</span>
                                    </span>
                                    <span className="text-xs font-black text-rose-400">До рулетки: {Math.max(0, ((Math.floor((state.currentTotalLikes || 0) / (state.likesRouletteThreshold || 100000)) + 1) * (state.likesRouletteThreshold || 100000)) - (state.currentTotalLikes || 0)).toLocaleString()}</span>
                                </div>
                                <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-700 relative">
                                    <div className="h-full bg-gradient-to-r from-rose-600 to-purple-600 animate-progress-shimmer transition-all duration-500" style={{ width: `${Math.min(100, Math.max(0, (((state.currentTotalLikes || 0) % (state.likesRouletteThreshold || 100000)) / (state.likesRouletteThreshold || 100000)) * 100))}%` }}></div>
                                </div>
                            </div>
                        )}

                        {/* Кнопки управления временем */}
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                            <h2 className="text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">Управление временем</h2>
                            <div className="grid grid-cols-4 gap-2 mb-4">
                                {[60, 300, 600, 1800].map(s => <button key={`a${s}`} className="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-500/30 rounded-lg py-2 text-sm font-black transition" onClick={() => socket.emit('manual-add', s)}>+{s/60}м</button>)}
                                {[60, 300, 600, 1800].map(s => <button key={`s${s}`} className="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-500/30 rounded-lg py-2 text-sm font-black transition" onClick={() => socket.emit('manual-sub', s)}>-{s/60}м</button>)}
                            </div>
                            
                            <div className="flex gap-2">
                                <input type="number" value={customSeconds} onChange={e => setCustomSeconds(Number(e.target.value))} className="w-1/2 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 font-black text-xl text-center text-white outline-none" placeholder="Секунды" />
                                <div className="w-1/2 grid grid-cols-2 gap-2">
                                    <button className="bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-lg font-bold transition flex items-center justify-center" onClick={() => socket.emit('manual-add', customSeconds)}><i className="fa-solid fa-plus"></i></button>
                                    <button className="bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-lg font-bold transition flex items-center justify-center" onClick={() => socket.emit('manual-sub', customSeconds)}><i className="fa-solid fa-minus"></i></button>
                                </div>
                            </div>
                        </div>
                        
                        {/* Глобальные действия */}
                        <div className="grid grid-cols-2 gap-3 mt-auto">
                            <button className="bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-xl font-bold transition text-sm flex items-center justify-center gap-2" onClick={() => socket.emit('toggle-timer')}><i className="fa-solid fa-play"></i> СТАРТ / ПАУЗА</button>
                            <button className="bg-purple-600 hover:bg-purple-500 text-white p-4 rounded-xl font-bold transition text-sm shadow-[0_0_15px_rgba(168,85,247,0.4)] flex items-center justify-center gap-2" onClick={() => socket.emit('manual-trigger-roulette')}><i className="fa-solid fa-dice"></i> КРУТИТЬ РУЛЕТКУ</button>
                        </div>
                    </div>
                    
                    {/* ПРАВАЯ ЧАСТЬ: ИСТОРИЯ ДОНАТОВ */}
                    <div className="w-1/2 bg-slate-950 p-6 flex flex-col">
                        <h2 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><i className="fa-solid fa-list text-indigo-400"></i> История Событий</h2>
                        
                        <div className="flex-1 overflow-y-auto pr-2 flex flex-col gap-2">
                            {history.length === 0 ? (
                                <div className="text-center text-slate-500 mt-10 text-sm font-bold">Ожидание событий...</div>
                            ) : (
                                history.map((h, i) => (
                                    <div key={i} className="flex items-center gap-3 bg-slate-900 p-3 rounded-xl border border-slate-800 text-white hover:border-slate-600 transition">
                                        <img src={h.avatar || 'https://via.placeholder.com/32'} className="w-10 h-10 rounded-full object-cover border border-slate-700" />
                                        <div className="flex flex-col flex-1 overflow-hidden">
                                            <span className="text-sm font-bold truncate text-slate-200">{h.username}</span>
                                            <span className="text-xs text-slate-400 truncate">{h.giftName || h.type} {h.amount > 1 ? `(x${h.amount})` : ''}</span>
                                        </div>
                                        <span className={`text-base font-black whitespace-nowrap ${h.timeAdded > 0 ? 'text-emerald-400' : h.timeAdded < 0 ? 'text-rose-400' : 'text-slate-300'}`}>{h.timeAdded > 0 ? '+' : ''}{h.timeAdded} {h.timeAdded !== 0 ? 'с' : ''}</span>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<RemoteApp />);
    </script>
</body>
</html>
